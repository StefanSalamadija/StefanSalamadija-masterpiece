<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2545" />
    <script>
      // Puts the last theme on <html> before the page is first painted, so night mode never starts with a white frame, and
      // gives the browser's status bar the colour of that theme's bars (BAR_BG in src/ui/theme.ts). localStorage only
      // mirrors the setting; the app corrects it from IndexedDB when it starts. `night` is Dark, as it was before piece 7.
      try {
        var theme = localStorage.getItem('mp-theme');
        if (theme === 'night') theme = 'dark';
        var bar = { day: '#0B2545', dark: '#0E1B2B', red: '#000000', contrast: '#000000' };
        if (theme === 'day' || theme === 'dark' || theme === 'red' || theme === 'contrast') {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bar[theme]);
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Masterpiece</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
